name = "ora-bot"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# Morning brief / evening review (hours-wide windows) and meeting/task reminders (minute precision): tick every minute.
[triggers]
crons = ["* * * * *"]

[vars]
# The api is reached through the public gateway (web service proxies /api/* to it). Change if your domain differs.
ORA_API_URL = "https://ora.amindadgar.com/api"

# The shared parser lives in web/src/lib and imports jalaali-js; resolve it from this package so the Worker builds on its own.
[alias]
"jalaali-js" = "./node_modules/jalaali-js"

# Secrets (never in this file):  wrangler secret put TELEGRAM_BOT_TOKEN | TELEGRAM_WEBHOOK_SECRET | BOT_SHARED_SECRET
